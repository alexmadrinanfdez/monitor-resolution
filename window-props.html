<!DOCTYPE html>
<html lang="en">
<head>
  <title>screen resolution</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Yanone Kaffeesatz">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
</head>

<body>
  <h1>
    The <a href="https://www.viewsonic.com/library/tech/monitor-resolution-aspect-ratio/" aria-describedby="resolution-definition">
      <span class="tooltip">resolution
        <span id="resolution-definition" class="tooltiptext" role="tooltip">
          Visual dimensions of a given display expressed in terms of width and height.
        </span>
      </span></a> of this screen is
    
    <p id="wxh" class="tooltip">
      <span id="width"></span> x <span id="height"></span>
      <span id="resolution" class="tooltiptext"></span>
    </p>
  </h1>

  <section id="diagnostics" aria-label="Display diagnostics" aria-live="polite">
    <p>Screen: <span id="screen-size"></span> CSS px</p>
    <p>Available screen: <span id="available-size"></span> CSS px</p>
    <p>Browser viewport: <span id="viewport-size"></span> CSS px</p>
    <p>Device pixel ratio: <span id="device-pixel-ratio"></span></p>
    <p>Aspect ratio: <span id="aspect-ratio"></span></p>
    <p>Orientation: <span id="orientation"></span></p>
    <p>Total screen pixels: <span id="total-pixels"></span></p>
  </section>

  <section id="actions" aria-label="Diagnostic actions">
    <button id="copy-diagnostics" type="button">Copy</button>
    <button id="share-diagnostics" type="button" hidden>Share</button>
    <p id="action-status" role="status" aria-live="polite"></p>
  </section>

  <!-- wline: horizontal line (width) -->
  <svg id="wline" width="100%" height="40" aria-hidden="true">
    <line x1="0" y1="50%" x2="100%" y2="50%"/>
    <line x1="0" y1="50%" x2="2%" y2="100%"/>
    <line x1="0" y1="50%" x2="2%" y2="0"/>
    <line x1="100%" y1="50%" x2="98%" y2="100%"/>
    <line x1="100%" y1="50%" x2="98%" y2="0"/>
    <line x1="2%" y1="0" x2="2%" y2="100%"/>
    <line x1="98%" y1="0" x2="98%" y2="100%"/>
  </svg>

  <!-- hline: vertical line (height) -->
  <svg id="hline" width="40" height="100%" aria-hidden="true">
    <line x1="50%" y1="0" x2="50%" y2="100%"/>
    <line x1="50%" y1="0" x2="100%" y2="4%"/>
    <line x1="50%" y1="0" x2="0" y2="4%"/>
    <line x1="50%" y1="100%" x2="100%" y2="96%"/>
    <line x1="50%" y1="100%" x2="0%" y2="96%"/>
    <line x1="0" y1="4%" x2="100%" y2="4%"/>
    <line x1="0" y1="96%" x2="100%" y2="96%"/>
  </svg>

  <script src="diagnostics.js"></script>
</body>
</html>
